apiVersion: v1
kind: Secret
metadata:
  name: health-check-email
  namespace: health-check-dev
type: Opaque
stringData:
  SMTP_HOST: "SMTP_HOST_PLACEHOLDER"
  SMTP_PORT: "SMTP_PORT_PLACEHOLDER"
  SMTP_STARTTLS: "SMTP_STARTTLS_PLACEHOLDER"
  SMTP_USERNAME: "SMTP_USERNAME_PLACEHOLDER"
  SMTP_PASSWORD: "SMTP_PASSWORD_PLACEHOLDER"
  MAIL_FROM: "MAIL_FROM_PLACEHOLDER"
  MAIL_TO: "MAIL_TO_PLACEHOLDER"
  MAIL_BCC: "MAIL_BCC_PLACEHOLDER"
