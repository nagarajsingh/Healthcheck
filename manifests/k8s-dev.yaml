apiVersion: v1
kind: Namespace
metadata:
  name: health-check-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-check
  namespace: health-check-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-check-dev-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-check-dev-reader
subjects:
  - kind: ServiceAccount
    name: health-check
    namespace: health-check-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-check-dev-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-check-dev-config
  namespace: health-check-dev
data:
  environments.yaml: |
    report:
      title: "Non-Prod Kubernetes Environment Status"
      timezone: "Asia/Kolkata"
      filesystem_threshold_percent: 75
      filesystem_warning_threshold_percent: 90
      request_timeout_seconds: 20

    environments:
      - name: "H2H-DEV"
        namespace: "h2h-dev"
        filesystem:
          enabled: true
          mount_path: "/h2hnetapp"
          preferred_pod_prefix: "debug-shell"
          threshold_percent: 75
          warning_threshold_percent: 90
        streams:
          enabled: true
          api_url: "https://scdf-dev.mashreqdev.com/streams/definitions"
          transport: "curl"
          verify_ssl: false
          page_size: 200
          expected_descriptions: ["AE", "BH", "EG", "KW", "QA"]
        titanms_legal_entities:
          enabled: true
          url: "https://titanms-dev.mashreqdev.com/login"
          verify_ssl: false
          timeout_seconds: 30
          expected_entities: ["AE", "BH", "EG", "KW", "QA"]
          selectors:
            dropdown: "select"
            options: "select option"
          ignored_options:
            - "Select"
            - "Select Legal Entity"
            - "Legal Entity"
            - "Choose Legal Entity"
            - "-- Select --"
        endpoints:
          enabled: false
          items: []

      - name: "IPP-SIT"
        namespace: "ip-sit"
        filesystem:
          enabled: true
          mount_paths: ["/mashnetapp-r2uat", "/nfsobp"]
          preferred_pod_prefix: "payroll-api"
          threshold_percent: 75
          warning_threshold_percent: 90
        endpoints:
          enabled: false
          items: []

      - name: "COLLECTIONS-SIT"
        namespace: "titan-sit"
        filesystem:
          enabled: true
          mount_paths: ["/vtmaster", "/vtchequecash", "/vtdashrep", "/vtcashdelivery", "/vtdds", "/vtcustomer"]
          preferred_pod_prefix: "collections-batch-01-service"
          threshold_percent: 75
          warning_threshold_percent: 90
        endpoints:
          enabled: false
          items: []
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubernetes-health-check
  namespace: health-check-dev
spec:
  schedule: "30 7 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: kubernetes-health-check
            environment: dev
        spec:
          serviceAccountName: health-check
          restartPolicy: Never
          imagePullSecrets:
            - name: docker-secret
          containers:
            - name: health-check
              image: mashrequae.azurecr.io/kubernetes-health-check:dev
              imagePullPolicy: Always
              args:
                - "--config"
                - "/config/environments.yaml"
                - "--template-dir"
                - "/app/templates"
                - "--output-dir"
                - "/app/output"
              env:
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.cluster.local,.svc,.mashreqdev.com,scdf-dev.mashreqdev.com,titanms-dev.mashreqdev.com"
                - name: no_proxy
                  value: "localhost,127.0.0.1,.cluster.local,.svc,.mashreqdev.com,scdf-dev.mashreqdev.com,titanms-dev.mashreqdev.com"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: output
                  mountPath: /app/output
          volumes:
            - name: config
              configMap:
                name: health-check-dev-config
            - name: output
              emptyDir: {}
