apiVersion: v1
kind: Namespace
metadata:
  name: health-check-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-check
  namespace: health-check-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-check-dev-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-check-dev-reader
subjects:
  - kind: ServiceAccount
    name: health-check
    namespace: health-check-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-check-dev-reader
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubernetes-health-check
  namespace: health-check-dev
spec:
  schedule: "30 7 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: kubernetes-health-check
            environment: dev
        spec:
          serviceAccountName: health-check
          restartPolicy: Never
          imagePullSecrets:
            - name: docker-secret
          containers:
            - name: health-check
              image: IMAGE_PLACEHOLDER
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  echo "Starting Kubernetes health check..."
                  rm -rf /app/output/*

                  python /app/scripts/collect_health.py \
                    --config /config/environments.yaml \
                    --template-dir /app/templates \
                    --output-dir /app/output

                  echo "Generated files:"
                  ls -la /app/output

                  python /app/scripts/send_email.py \
                    --html-file /app/output/health-report.html \
                    --subject-file /app/output/email-subject.txt

                  echo "Health check completed successfully."
              env:
                - name: TZ
                  value: "Asia/Kolkata"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.cluster.local,.svc,.mashreqdev.com,scdf-dev.mashreqdev.com,titanms-dev.mashreqdev.com"
                - name: no_proxy
                  value: "localhost,127.0.0.1,.cluster.local,.svc,.mashreqdev.com,scdf-dev.mashreqdev.com,titanms-dev.mashreqdev.com"
              envFrom:
                - secretRef:
                    name: health-check-email
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: output
                  mountPath: /app/output
          volumes:
            - name: config
              configMap:
                name: health-check-dev-config
            - name: output
              emptyDir: {}
