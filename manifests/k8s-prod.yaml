apiVersion: v1
kind: Namespace
metadata:
  name: health-check-prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-check
  namespace: health-check-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-check-prod-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-check-prod-reader
subjects:
  - kind: ServiceAccount
    name: health-check
    namespace: health-check-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-check-prod-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-check-prod-config
  namespace: health-check-prod
data:
  environments.yaml: |
    report:
      title: "Production Kubernetes Environment Status"
      timezone: "Asia/Dubai"
      filesystem_threshold_percent: 75
      filesystem_warning_threshold_percent: 90
      request_timeout_seconds: 20

    environments: []
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubernetes-health-check
  namespace: health-check-prod
  labels:
    app: kubernetes-health-check
    environment: prod
spec:
  schedule: "30 7 * * *"
  timeZone: "Asia/Dubai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: kubernetes-health-check
            environment: prod
        spec:
          serviceAccountName: health-check
          restartPolicy: Never
          imagePullSecrets:
            - name: docker-secret
          containers:
            - name: health-check
              image: IMAGE_PLACEHOLDER
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "Starting Kubernetes health check..."
                  rm -rf /app/output/*
                  mkdir -p /app/output

                  python /app/scripts/collect_health.py \
                    --config /config/environments.yaml \
                    --template-dir /app/templates \
                    --output-dir /app/output

                  echo "Generated files:"
                  ls -la /app/output
                  test -s /app/output/health-report.html
                  test -s /app/output/health-report.json
                  test -s /app/output/email-subject.txt

                  echo "===== HEALTH REPORT JSON START ====="
                  cat /app/output/health-report.json
                  echo "===== HEALTH REPORT JSON END ====="

                  python /app/scripts/send_email.py \
                    --html-file /app/output/health-report.html \
                    --subject-file /app/output/email-subject.txt

                  echo "Kubernetes health check completed successfully."
              env:
                - name: TZ
                  value: "Asia/Dubai"
                - name: PYTHONUNBUFFERED
                  value: "1"
              envFrom:
                - secretRef:
                    name: health-check-email
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: output
                  mountPath: /app/output
          volumes:
            - name: config
              configMap:
                name: health-check-prod-config
            - name: output
              emptyDir: {}
